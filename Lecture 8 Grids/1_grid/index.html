<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
           
            height: 600px;
            width: 600px;
            margin: auto;
            margin-top: 50px;
            grid-template-columns:repeat(4,1fr) ;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-areas:
            "div-1 div-2 div-2 div-3"
            "div-1 div-2 div-2 div-4"
            "div-6 div-2 div-2 div-4"
            "div-5 div-5 div-5 div-4";

            
        }
        .container{
            justify-content: center;
            align-content: center;
        }

        .div-1{
            background-color: aquamarine;
            grid-area: div-1;
            /* grid-column: 1/2;
            grid-row: 1/3; */
        }
          .div-2{
            background-color: rebeccapurple;
            grid-area: div-2;
            /* grid-column: 2/4;
            grid-row: 1/4; */

        }
          .div-3{
            background-color:red;
            grid-area: div-3;
            /* grid-column: 4/5;
            grid-row: 1/2; */
        }
          .div-4{
            background-color: yellow;
            grid-area: div-4;
            /* grid-column: 1/2;
            grid-row: 3/4; */
        }
          .div-5{
            background-color: blue;
            grid-area: div-5;
            /* grid-column: 1/4;
            grid-row: 4/5; */
        }
          .div-6{
            background-color: palevioletred;
            grid-area: div-6;
            /* grid-column: 4/5;
            grid-row: 2/5; */
        }
        .div{
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="div div-1">1</div>
        <div class="div div-2">2</div>
        <div class="div div-3">3</div>
        <div class="div div-4">4</div>
        <div class="div div-5">5</div>
        <div class="div div-6">6</div>

    </div>
</body>
</html>
